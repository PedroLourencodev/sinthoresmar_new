name: sinthoresmar_novo
description: "App do SINTHORESMAR"
publish_to: "none"
version: 1.0.0+16

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter


  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.0
  font_awesome_flutter: ^10.12.0
  supabase_flutter: ^2.6.0
  brasil_fields: ^1.14.0
  mask_text_input_formatter: ^2.8.0
  intl: ^0.20.2
  file_picker: ^10.3.7
  currency_text_input_formatter: ^2.3.0
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/sinthoresmar_logo.png

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/sinthoresmar_logo.png"
  adaptive_icon_background: "#061A40"
  adaptive_icon_foreground: "assets/images/sinthoresmar_logo.png"
